name: Validate all mods
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.288
      - name: Validate marketplace
        run: claude plugin validate .claude-plugin/marketplace.json --strict
      - name: Test all plugins without sign-in or network calls
        run: python3 scripts/check.py
      - name: Audit committed artifacts
        run: python3 scripts/audit.py
      - name: Upload native check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-check-results
          path: docs/check-results.json
