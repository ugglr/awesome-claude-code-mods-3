</style></head><body><main id="capture"><div class="meta"><div class="eyebrow">AWESOME CLAUDE CODE MODS / GIT</div><span class="badge">FIXTURE PREVIEW · SAMPLE DATA</span></div><div class="window"><div class="chrome"><span class="dots">● ● ●</span><span class="command">/worktree-map</span></div><div class="pane"></div></div><div class="footer"><strong>13 / 50</strong> · See where parallel work lives.<div class="sep"></div>Captured from the mod's render tree by Claude Code 2.1.288's test kit.<br>Browser preview styling; native Terminal and Desktop painting may differ.</div></main><script>const DATA={"id": "worktree-map", "tree": {"type": "Box", "props": {"flexDirection": "column", "gap": 1}, "children": [{"type": "Text", "props": {"bold": true, "color": "cyan"}, "children": ["Worktree Map"]}, {"type": "Text", "props": {"dimColor": true}, "children": ["List worktree paths, branches, and locked states."]}, {"type": "Code", "props": {"source": "worktree /work\nHEAD 123abcd\nbranch refs/heads/main\n\nworktree /work-review\nHEAD 456def0\nbranch refs/heads/review\n", "language": "text"}}, {"type": "Button", "props": {"key": "refresh", "label": "Refresh Git state", "hotkey": "r", "plain": true}}]}, "sourceSha256": "cb301520b0ad1cea7e6fcc17e50e42f1c97135ad757efabf4a970f2fcbb3d95c"};
const colors={cyan:'#67e8f9',green:'#86efac',yellow:'#fcd34d',red:'#fda4af'};
function render(n){
 if(typeof n==='string'){const t=document.createElement('span');t.textContent=n;return t}
 const p=n.props||{};let el=document.createElement('div');
 if(n.type==='Box'){el.className='box';el.style.flexDirection=p.flexDirection||'row';el.style.gap=(p.gap||p.columnGap||0)*12+'px';if(p.flexWrap)el.style.flexWrap=p.flexWrap;(n.children||[]).forEach(c=>el.append(render(c)))}
 else if(n.type==='Text'){el.className='text';el.textContent=(n.children||[]).join('');if(p.bold)el.style.fontWeight='700';if(p.color)el.style.color=colors[p.color]||p.color;if(p.dimColor)el.style.color='#92a3ba'}
 else if(n.type==='Code'){el=document.createElement('pre');el.className='code';el.textContent=p.source||''}
 else if(n.type==='Button'){el.className='button'+(p.plain?' plain':'');if(p.hotkey){const k=document.createElement('span');k.className='key';k.textContent=p.hotkey+':';el.append(k)}const label=document.createElement('span');label.textContent=p.label;el.append(label);if(p.dimColor)el.style.opacity='.65'}
 else if(n.type==='Input'){el.className='input';const label=document.createElement('b');label.textContent=(p.label||'Input')+': ';el.append(label);const value=document.createElement('span');value.textContent=p.value||p.placeholder||'';el.append(value);const hint=document.createElement('small');hint.textContent='↵ '+(p.submitLabel||'apply');el.append(hint)}
 else if(n.type==='Link'){el.className='link';el.textContent=(p.label?p.label+' · ':'')+p.href}
 else throw Error('Unsupported preview element '+n.type);
 return el
}
document.querySelector('.pane').append(render(DATA.tree));
</script></body></html>
